name: Android

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: expo-video-encoder
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Build and pack the module
        working-directory: expo-video-encoder
        run: |
          npm ci
          npm pack
      - name: Scaffold a host Expo app
        run: npx --yes create-expo-app@latest host --template blank --no-install
      - name: Install host app dependencies and the packed module
        working-directory: host
        run: |
          npm install
          npm install ../expo-video-encoder/expo-video-encoder-*.tgz
      - name: Prebuild the Android project
        working-directory: host
        run: npx expo prebuild --platform android --no-install
      - name: Compile the native module
        working-directory: host/android
        run: |
          ./gradlew :expo-video-encoder:compileDebugKotlin --no-daemon --stacktrace \
            || ./gradlew :expo-video-encoder:assembleDebug --no-daemon --stacktrace \
            || ./gradlew assembleDebug --no-daemon --stacktrace
