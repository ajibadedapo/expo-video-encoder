name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  auto-merge:
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge for patch, minor and GitHub Actions updates
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
        run: |
          case "$ECOSYSTEM" in
            github_actions|github-actions) eligible=true ;;
            *)
              case "$UPDATE_TYPE" in
                version-update:semver-patch|version-update:semver-minor) eligible=true ;;
                *) eligible=false ;;
              esac
              ;;
          esac
          if [ "$eligible" = "true" ]; then
            echo "Enabling auto-merge ($ECOSYSTEM, $UPDATE_TYPE)"
            gh pr merge --auto --squash "$PR_URL"
          else
            echo "Leaving this pull request for review ($ECOSYSTEM, $UPDATE_TYPE)"
          fi
